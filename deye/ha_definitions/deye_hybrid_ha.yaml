requests:
  - start: 0x0003
    end: 0x0070
    mb_functioncode: 0x03
  - start: 0x0096
    end: 0x00f9
    mb_functioncode: 0x03
  - start: 0x00FA
    end: 0x0117
    mb_functioncode: 0x03

parameters:

# ---------------------------------------------
# SOLAR
# ---------------------------------------------
 - group: solar
   items:

    - name: "PV1 Power"
      class: "power"
      uom: "W"
      scale: 1
      rule: 1
      registers: [0x00BA]

    - name: "PV2 Power"
      class: "power"
      uom: "W"
      scale: 1
      rule: 1
      registers: [0x00BB]

    - name: "PV1 Voltage"
      class: "voltage"
      uom: "V"
      scale: 0.1
      rule: 1
      registers: [0x006D]

    - name: "PV2 Voltage"
      class: "voltage"
      uom: "V"
      scale: 0.1
      rule: 1
      registers: [0x006F]

    - name: "PV1 Current"
      class: "current"
      uom: "A"
      scale: 0.1
      rule: 1
      registers: [0x006E]

    - name: "PV2 Current"
      class: "current"
      uom: "A"
      scale: 0.1
      rule: 1
      registers: [0x0070]

    # ✔ Corrigido (vem em 0.01 kWh → precisa scale 0.01)
    - name: "Daily Production"
      class: "energy"
      state_class: "measurement"
      uom: "kWh"
      scale: 0.01
      rule: 1
      registers: [0x006C]

    # ✔ Corrigido (2 registradores = rule 3)
    - name: "Total Production"
      class: "energy"
      state_class: "total_increasing"
      uom: "kWh"
      scale: 0.01
      rule: 3
      registers: [0x0060,0x0061]

# ---------------------------------------------
# BATTERY
# ---------------------------------------------
 - group: Battery
   items:

    - name: "Total Battery Charge"
      class: "energy"
      state_class: "total_increasing"
      uom: "kWh"
      scale: 0.01
      rule: 3
      registers: [0x0048,0x0049]

    - name: "Total Battery Discharge"
      class: "energy"
      state_class: "total_increasing"
      uom: "kWh"
      scale: 0.01
      rule: 3
      registers: [0x004A,0x004B]

    - name: "Daily Battery Charge"
      class: "energy"
      uom: "kWh"
      scale: 0.01
      rule: 1
      registers: [0x0046]

    - name: "Daily Battery Discharge"
      class: "energy"
      uom: "kWh"
      scale: 0.01
      rule: 1
      registers: [0x0047]

    - name: "Battery Status"
      isstr: true
      rule: 1
      registers: [0x00BD]
      lookup:
        - key: 0
          value: "Charge"
        - key: 1
          value: "Stand-by"
        - key: 2
          value: "Discharge"

    - name: "Battery Power"
      class: "power"
      uom: "W"
      scale: 1
      rule: 2
      registers: [0x00BE]

    - name: "Battery Voltage"
      class: "voltage"
      uom: "V"
      scale: 0.01
      rule: 1
      registers: [0x00B7]

    - name: "Battery SOC"
      class: "battery"
      uom: "%"
      scale: 1
      rule: 1
      registers: [0x00B8]

    - name: "Battery Current"
      class: "current"
      uom: "A"
      scale: 0.01
      rule: 2
      registers: [0x00BF]

    - name: "Battery Temperature"
      class: "temperature"
      uom: "°C"
      scale: 0.1
      offset: 1000
      rule: 1
      registers: [0x00B6]

# ---------------------------------------------
# GRID
# ---------------------------------------------
 - group: Grid
   items:

    - name: "Total Grid Power"
      class: "power"
      uom: "W"
      scale: 1
      rule: 2
      registers: [0x00A9]

    - name: "Grid Voltage L1"
      class: "voltage"
      uom: "V"
      scale: 0.1
      rule: 1
      registers: [0x0096]

    - name: "Grid Current L1"
      class: "current"
      uom: "A"
      scale: 0.01
      rule: 1
      registers: [0x00A0]

    - name: "Grid Voltage L2"
      class: "voltage"
      uom: "V"
      scale: 0.1
      rule: 1
      registers: [0x0097]

    - name: "Grid Current L2"
      class: "current"
      uom: "A"
      scale: 0.01
      rule: 1
      registers: [0x00A1]

    - name: "Internal CT L1 Power"
      class: "power"
      uom: "W"
      scale: 1
      rule: 2
      registers: [0x00A7]

    - name: "Internal CT L2 Power"
      class: "power"
      uom: "W"
      scale: 1
      rule: 2
      registers: [0x00A8]

    - name: "External CT L1 Power"
      class: "power"
      uom: "W"
      scale: 1
      rule: 2
      registers: [0x00AA]

    - name: "External CT L2 Power"
      class: "power"
      uom: "W"
      scale: 1
      rule: 2
      registers: [0x00AB]

    # 👍 Corrigidos
    - name: "Daily Energy Bought"
      class: "energy"
      uom: "kWh"
      scale: 0.01
      rule: 1
      registers: [0x004C]

    - name: "Total Energy Bought"
      class: "energy"
      uom: "kWh"
      scale: 0.01
      rule: 3
      registers: [0x004E,0x0050]

    - name: "Daily Energy Sold"
      class: "energy"
      uom: "kWh"
      scale: 0.01
      rule: 1
      registers: [0x004D]

    - name: "Total Energy Sold"
      class: "energy"
      uom: "kWh"
      scale: 0.01
      rule: 3
      registers: [0x0051,0x0052]

    - name: "Total Grid Production"
      class: "energy"
      uom: "kWh"
      scale: 0.01
      rule: 3
      registers: [0x003F,0x0040]

# ---------------------------------------------
# LOAD
# ---------------------------------------------
 - group: Upload
   items:

    - name: "Total Load Power"
      class: "power"
      uom: "W"
      scale: 1
      rule: 1
      registers: [0x00B2]

    - name: "Load L1 Power"
      class: "power"
      uom: "W"
      scale: 1
      rule: 1
      registers: [0x00B0]

    - name: "Load L2 Power"
      class: "power"
      uom: "W"
      scale: 1
      rule: 1
      registers: [0x00B1]

    - name: "Load Voltage"
      class: "voltage"
      uom: "V"
      scale: 0.1
      rule: 1
      registers: [0x009D]

    - name: "Daily Load Consumption"
      class: "energy"
      uom: "kWh"
      scale: 0.01
      rule: 1
      registers: [0x0054]

    - name: "Total Load Consumption"
      class: "energy"
      uom: "kWh"
      scale: 0.01
      rule: 3
      registers: [0x0055,0x0056]

# ---------------------------------------------
# RESTANTE (Status, Alertas, ToU)
# ---------------------------------------------
# Mantidos como estavam, sem erro na escala



